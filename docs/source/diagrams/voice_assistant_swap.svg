<svg viewBox="0 0 820 470" role="img" aria-label="The voice assistant on a desk and on real traffic. On the desk MicSource feeds stt (TranscriberSherpa), llm (PrompterOllama) and tts (SynthesizerSherpa), which feeds SpeakerSink; stt and llm also feed console (NotifierConsole); model_name of the llm takes any model served by Ollama. On real traffic AudioRtp receives a call as RTP, G.711 at 8 kHz, from Janus or Asterisk, and AudioWriter writes the answers to answer.wav. stt, llm, tts and console are the same in both: only the type and the configuration of the two end nodes change, and the optional group they need.">
<defs><marker id="voice_assistant_swap-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="voice_assistant_swap-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
