<svg viewBox="0 0 400 40" role="img" aria-label="The voice assistant pipeline: MicSource records the question, TranscriberSherpa turns it into text, PrompterOllama asks a language model served by Ollama, SynthesizerSherpa speaks the answer and SpeakerSink plays it. The transcription and the answer also go to NotifierConsole, which prints them on the terminal.">
