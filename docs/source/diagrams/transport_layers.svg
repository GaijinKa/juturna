<svg viewBox="0 0 700 540" role="img" aria-label="The pipeline reads its configuration and builds the nodes of its worker. Nodes take queues, events and worker threads from the TransportBackend; the pipeline asks it for node_scope() and remote_destination(). Two backends implement it: ThreadingTransport with OS threads, and BrowserTransport with Web Workers in Pyodide.">
