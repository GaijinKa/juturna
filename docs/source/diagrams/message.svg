<svg viewBox="0 0 960 250" role="img" aria-label="A message: id, created_at, creator and version; the meta and timers dictionaries; and a payload of type T. The whole message becomes read-only when it is transmitted.">
<defs><marker id="message-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="message-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bx grp" x="10" y="10" width="940" height="230" rx="14"/><text class="t lab" x="26" y="34">MESSAGE[T]</text>
<rect class="bx" x="30" y="50" width="210" height="60" rx="12"/>
<text class="t m" x="135.0" y="77.0" text-anchor="middle">id</text><text class="t s " x="135.0" y="97.0" text-anchor="middle">sequence number</text>
<rect class="bx" x="260" y="50" width="210" height="60" rx="12"/>
<text class="t m" x="365.0" y="77.0" text-anchor="middle">created_at</text><text class="t s " x="365.0" y="97.0" text-anchor="middle">creation time</text>
<rect class="bx" x="490" y="50" width="210" height="60" rx="12"/>
<text class="t m" x="595.0" y="77.0" text-anchor="middle">creator</text><text class="t s " x="595.0" y="97.0" text-anchor="middle">name of the sender node</text>
<rect class="bx" x="720" y="50" width="210" height="60" rx="12"/>
<text class="t m" x="825.0" y="77.0" text-anchor="middle">version</text><text class="t s " x="825.0" y="97.0" text-anchor="middle">version of the data</text>
<rect class="bx" x="30" y="140" width="210" height="72" rx="12"/>
<text class="t m" x="135.0" y="173.0" text-anchor="middle">meta</text><text class="t s " x="135.0" y="193.0" text-anchor="middle">dict, free-form</text>
<rect class="bx" x="260" y="140" width="210" height="72" rx="12"/>
<text class="t m" x="365.0" y="173.0" text-anchor="middle">timers</text><text class="t s " x="365.0" y="193.0" text-anchor="middle">name → time</text>
<rect class="bx core" x="490" y="140" width="440" height="72" rx="12"/>
<text class="t m" x="710.0" y="173.0" text-anchor="middle">payload: T</text><text class="t s " x="710.0" y="193.0" text-anchor="middle">AudioPayload, ImagePayload, VideoPayload, …</text>
</svg>
