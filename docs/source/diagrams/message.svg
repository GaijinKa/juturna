<svg viewBox="0 0 700 250" role="img" aria-label="A message: id, created_at, creator and version; the meta and timers dictionaries; and a payload of type T. The whole message becomes read-only when it is transmitted.">
<defs><marker id="message-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="message-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bx grp" x="4" y="10" width="692" height="230" rx="14"/><text class="t lab" x="20" y="34">MESSAGE[T]</text>
<rect class="bx" x="30" y="50" width="130" height="60" rx="12"/>
<text class="t m" x="95.0" y="77.0" text-anchor="middle">id</text><text class="t s " x="95.0" y="97.0" text-anchor="middle">sequence number</text>
<rect class="bx" x="180" y="50" width="140" height="60" rx="12"/>
<text class="t m" x="250.0" y="77.0" text-anchor="middle">created_at</text><text class="t s " x="250.0" y="97.0" text-anchor="middle">creation time</text>
<rect class="bx" x="340" y="50" width="180" height="60" rx="12"/>
<text class="t m" x="430.0" y="77.0" text-anchor="middle">creator</text><text class="t s " x="430.0" y="97.0" text-anchor="middle">name of the sender node</text>
<rect class="bx" x="540" y="50" width="140" height="60" rx="12"/>
<text class="t m" x="610.0" y="77.0" text-anchor="middle">version</text><text class="t s " x="610.0" y="97.0" text-anchor="middle">version of the data</text>
<rect class="bx" x="30" y="140" width="150" height="72" rx="12"/>
<text class="t m" x="105.0" y="173.0" text-anchor="middle">meta</text><text class="t s " x="105.0" y="193.0" text-anchor="middle">dict, free-form</text>
<rect class="bx" x="200" y="140" width="150" height="72" rx="12"/>
<text class="t m" x="275.0" y="173.0" text-anchor="middle">timers</text><text class="t s " x="275.0" y="193.0" text-anchor="middle">name → time</text>
<rect class="bx core" x="370" y="140" width="300" height="72" rx="12"/>
<text class="t m" x="520.0" y="173.0" text-anchor="middle">payload: T</text><text class="t s " x="520.0" y="193.0" text-anchor="middle">AudioPayload, ImagePayload, VideoPayload, …</text>
</svg>
